name: Validate Terraform Blueprints

# Keeps the reusable Oracle Database@Cloud blueprints under blueprints/ formatted
# and valid as they evolve. Runs only when blueprint files (or this workflow) change.

on:
  push:
    paths:
      - "blueprints/**"
      - ".github/workflows/blueprints-validate.yml"
  pull_request:
    paths:
      - "blueprints/**"
      - ".github/workflows/blueprints-validate.yml"

permissions:
  contents: read

jobs:
  fmt:
    name: terraform fmt -check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Check formatting (recursive)
        run: terraform fmt -check -recursive blueprints

  validate:
    name: terraform validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - db-at-aws
          - db-at-azure
          - db-at-gcp
    defaults:
      run:
        working-directory: blueprints/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # No cloud credentials needed: -backend=false skips state, and validate only
      # needs the providers, which init downloads from the registry.
      - name: terraform init
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate -no-color
