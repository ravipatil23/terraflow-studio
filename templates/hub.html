<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info Hub — Terraflow Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff;--off:#f5f4f1;--off2:#eeece8;--line:#d8d5cf;
  --ink:#1a1916;--ink2:#4a4840;--ink3:#888480;--ink4:#b0ada8;
  --orange:#e8500a;--orange2:#ff6b2b;--o-dim:rgba(232,80,10,0.08);--o-dim2:rgba(232,80,10,0.18);
  --green:#1a7a4a;--green-dim:rgba(26,122,74,0.08);
  --blue:#1a56a0;--blue-dim:rgba(26,86,160,0.08);
  --purple:#6b2fb5;--purple-dim:rgba(107,47,181,0.08);
  --aws:#e8500a;--azure:#1a56a0;--gcp:#1a7a4a;
  --radius:6px;--radius-lg:10px;
  --font-d:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;--font-m:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{background:linear-gradient(150deg,#1e1c1a 0%,#141210 100%);color:var(--ink);font-family:var(--font-b);min-height:100vh;display:flex;flex-direction:column;}

/* Header */
header{background:#000000;padding:0 28px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 16px rgba(0,0,0,0.45);}
.logo{display:flex;align-items:baseline;gap:14px;text-decoration:none;}
.logo-name{font-family:var(--font-d);font-weight:800;font-size:22px;color:#fff;line-height:1;}
.logo-name .ac{color:#ff6b2b;}
.logo-sub{font-family:var(--font-m);font-size:10px;color:#555;letter-spacing:.06em;text-transform:uppercase;}
.header-right{display:flex;align-items:center;gap:10px;}
.nav-link{font-family:var(--font-d);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;border-radius:var(--radius);border:1px solid #333;color:#888;text-decoration:none;transition:all .15s;}
.nav-link:hover{color:#ccc;border-color:#555;}

/* Layout */
.page-wrap{flex:1;display:flex;flex-direction:column;max-width:860px;margin:0 auto;width:100%;padding:32px 24px 64px;}
.page-title{font-family:var(--font-d);font-weight:800;font-size:28px;color:#f0ede8;letter-spacing:-.5px;margin-bottom:4px;}
.page-sub{font-size:13px;color:#5a5650;margin-bottom:24px;}

/* Cloud filter tabs */
.cloud-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.cloud-tab{font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 18px;border-radius:var(--radius);border:1.5px solid #333;background:transparent;color:#666;cursor:pointer;transition:all .15s;}
.cloud-tab:hover{border-color:#555;color:#ccc;}
.cloud-tab.active-all{border-color:var(--orange2);background:var(--o-dim2);color:var(--orange2);}
.cloud-tab.active-aws{border-color:var(--aws);background:rgba(232,80,10,.15);color:#ff8c50;}
.cloud-tab.active-azure{border-color:var(--azure);background:var(--blue-dim);color:#5b8fd4;}
.cloud-tab.active-gcp{border-color:var(--gcp);background:var(--green-dim);color:#3ab574;}

/* Ask box */
.ask-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.32);margin-bottom:20px;}
.ask-header{padding:14px 22px;border-bottom:1px solid var(--line);background:var(--off);display:flex;align-items:center;gap:10px;}
.ask-label{font-family:var(--font-d);font-weight:800;font-size:16px;color:var(--ink);}
.cloud-badge{font-family:var(--font-m);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:9999px;border:1px solid;}
.badge-all{border-color:var(--orange);color:var(--orange);background:var(--o-dim);}
.badge-aws{border-color:var(--aws);color:var(--aws);background:var(--o-dim);}
.badge-azure{border-color:var(--azure);color:var(--azure);background:var(--blue-dim);}
.badge-gcp{border-color:var(--gcp);color:var(--gcp);background:var(--green-dim);}
.ask-body{padding:20px 22px;}
.ask-row{display:flex;gap:10px;}
.ask-input{flex:1;background:var(--off2);border:1.5px solid var(--line);border-radius:var(--radius);color:var(--ink);font-family:var(--font-b);font-size:14px;padding:10px 14px;outline:none;transition:border-color .15s;resize:none;min-height:56px;line-height:1.5;}
.ask-input:focus{border-color:var(--orange);background:#fff;}
.btn-ask{font-family:var(--font-d);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 24px;border-radius:var(--radius);border:none;background:var(--orange);color:#fff;cursor:pointer;transition:background .15s;white-space:nowrap;align-self:flex-end;}
.btn-ask:hover:not(:disabled){background:#c84208;}
.btn-ask:disabled{opacity:.45;cursor:not-allowed;}
.example-qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.example-q{font-family:var(--font-m);font-size:11px;color:var(--ink3);background:var(--off2);border:1px solid var(--line);border-radius:9999px;padding:4px 12px;cursor:pointer;transition:all .15s;}
.example-q:hover{background:var(--off);border-color:var(--orange);color:var(--orange);}

/* Answer card */
.answer-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.32);margin-bottom:16px;display:none;}
.answer-card.visible{display:block;}
.answer-header{padding:12px 22px;border-bottom:1px solid var(--line);background:var(--off);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.answer-label{font-family:var(--font-d);font-weight:800;font-size:15px;color:var(--ink);}
.answer-q{font-family:var(--font-m);font-size:11px;color:var(--ink4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:440px;}
.answer-body{padding:20px 22px;}
.answer-text{font-size:14px;color:var(--ink);line-height:1.7;white-space:pre-wrap;font-family:var(--font-b);}
.answer-text.loading{color:var(--ink4);font-style:italic;}
.answer-text.error{color:#c0392b;}

/* Sources */
.sources-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.32);display:none;}
.sources-card.visible{display:block;}
.sources-header{padding:12px 22px;border-bottom:1px solid var(--line);background:var(--off);}
.sources-label{font-family:var(--font-d);font-weight:800;font-size:14px;color:var(--ink);}
.sources-list{padding:14px 22px;display:flex;flex-direction:column;gap:6px;}
.source-chip{font-family:var(--font-m);font-size:11px;color:var(--ink2);background:var(--off2);border:1px solid var(--line);border-radius:var(--radius);padding:5px 12px;display:inline-block;}
.source-links{padding:0 22px 14px;display:flex;flex-wrap:wrap;gap:8px;}
.source-link{font-family:var(--font-d);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--orange);border:1px solid var(--orange);border-radius:var(--radius);padding:5px 14px;text-decoration:none;transition:background .15s;}
.source-link:hover{background:#c84208;border-color:#c84208;}

/* History */
.history-section{margin-top:28px;}
.history-label{font-family:var(--font-d);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#444;margin-bottom:10px;}
.history-list{display:flex;flex-direction:column;gap:8px;}
.history-item{background:rgba(255,255,255,.04);border:1px solid #2a2826;border-radius:var(--radius);padding:10px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;}
.history-item:hover{background:rgba(255,255,255,.07);border-color:#3a3632;}
.history-q{font-size:13px;color:#aaa;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.history-cloud{font-family:var(--font-m);font-size:10px;letter-spacing:.05em;text-transform:uppercase;}
.hc-all{color:var(--orange2);}
.hc-aws{color:#ff8c50;}
.hc-azure{color:#5b8fd4;}
.hc-gcp{color:#3ab574;}

/* Spinner */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">
    <div class="logo-name">Terraflow<span class="ac"> Studio</span></div>
    <div class="logo-sub">Info Hub</div>
  </a>
  <div class="header-right">
    <a class="nav-link" href="/aws">AWS</a>
    <a class="nav-link" href="/gcp">GCP</a>
    <a class="nav-link" href="/rag">RAG Docs</a>
    <a class="nav-link" href="/">&#8592; Home</a>
  </div>
</header>

<div class="page-wrap">
  <div class="page-title">Oracle DB Info Hub</div>
  <div class="page-sub">Ask anything about Oracle Database@AWS, DB@Azure, or DB@GCP — networking, Terraform, constraints, provisioning.</div>

  <!-- Cloud filter -->
  <div class="cloud-tabs">
    <button class="cloud-tab active-all" data-cloud="all"   onclick="setCloud('all')">All Clouds</button>
    <button class="cloud-tab"            data-cloud="aws"   onclick="setCloud('aws')">AWS</button>
    <button class="cloud-tab"            data-cloud="azure" onclick="setCloud('azure')">Azure</button>
    <button class="cloud-tab"            data-cloud="gcp"   onclick="setCloud('gcp')">GCP</button>
  </div>

  <!-- Ask -->
  <div class="ask-card">
    <div class="ask-header">
      <span class="ask-label">Ask a Question</span>
      <span class="cloud-badge badge-all" id="cloudBadge">All Clouds</span>
    </div>
    <div class="ask-body">
      <div class="ask-row">
        <textarea class="ask-input" id="questionInput" rows="2"
          placeholder="e.g. What is the minimum CIDR size for an AWS VM cluster with 4 nodes?"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ask();}"></textarea>
        <button class="btn-ask" id="askBtn" onclick="ask()">Ask</button>
      </div>
      <div class="example-qs" id="exampleQs"></div>
    </div>
  </div>

  <!-- Answer -->
  <div class="answer-card" id="answerCard">
    <div class="answer-header">
      <span class="answer-label">Answer</span>
      <span class="answer-q" id="answerQ"></span>
    </div>
    <div class="answer-body">
      <div class="answer-text" id="answerText"></div>
    </div>
  </div>

  <!-- Sources -->
  <div class="sources-card" id="sourcesCard">
    <div class="sources-header">
      <span class="sources-label">Sources used</span>
    </div>
    <div class="sources-list" id="sourcesList"></div>
    <div class="source-links" id="sourceLinks"></div>
  </div>

  <!-- History -->
  <div class="history-section" id="historySection" style="display:none;">
    <div class="history-label">Recent questions</div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
// ── state ─────────────────────────────────────────────────────────────────────

let currentCloud = 'all';
const history    = [];   // [{q, cloud, answer, sources}]

const EXAMPLES = {
  all:   [
    'What is the minimum CIDR for a client subnet?',
    'How long does VM Cluster provisioning take?',
    'What Terraform provider version is required?',
    'What are immutable fields on a VM Cluster?',
  ],
  aws:   [
    'What CIDR size do I need for 4-node AWS VM cluster?',
    'What NSGs are auto-created on an ODB network?',
    'Which AWS AZ IDs support ODB networks?',
    'What is the difference between s3_access and zero_etl_access?',
  ],
  azure: [
    'What is a delegated subnet in DB@Azure?',
    'What storage types are supported for Azure VM Cluster?',
    'Which settings are immutable after Azure VM Cluster creation?',
    'Does Exascale storage support Oracle 19c on Azure?',
  ],
  gcp:   [
    'What are the GCP network topology options?',
    'What is gcp_oracle_zone format?',
    'What is the difference between grid_image_id and gi_version?',
    'When is a backup subnet required on GCP?',
  ],
};

// ── cloud filter ──────────────────────────────────────────────────────────────

function setCloud(cloud) {
  currentCloud = cloud;
  document.querySelectorAll('.cloud-tab').forEach(t => {
    t.className = 'cloud-tab' + (t.dataset.cloud === cloud ? ' active-' + cloud : '');
  });
  const badge = document.getElementById('cloudBadge');
  const labels = {all:'All Clouds', aws:'AWS', azure:'Azure', gcp:'GCP'};
  badge.textContent  = labels[cloud];
  badge.className    = `cloud-badge badge-${cloud}`;
  renderExamples();
}

function renderExamples() {
  const qs = EXAMPLES[currentCloud] || EXAMPLES.all;
  document.getElementById('exampleQs').innerHTML = qs.map(q =>
    `<span class="example-q" onclick="useExample(this.textContent)">${q}</span>`
  ).join('');
}

function useExample(q) {
  document.getElementById('questionInput').value = q;
  document.getElementById('questionInput').focus();
}

// ── ask ───────────────────────────────────────────────────────────────────────

async function ask() {
  const question = document.getElementById('questionInput').value.trim();
  if (!question) return;

  const btn        = document.getElementById('askBtn');
  const answerCard = document.getElementById('answerCard');
  const answerText = document.getElementById('answerText');
  const answerQ    = document.getElementById('answerQ');
  const srcCard    = document.getElementById('sourcesCard');
  const srcList    = document.getElementById('sourcesList');

  // Show loading state
  btn.disabled         = true;
  btn.innerHTML        = '<span class="spinner"></span>';
  answerCard.classList.add('visible');
  srcCard.classList.remove('visible');
  answerQ.textContent  = question;
  answerText.className = 'answer-text loading';
  answerText.textContent = 'Thinking…';
  answerCard.scrollIntoView({behavior:'smooth', block:'nearest'});

  try {
    const res  = await fetch('/api/llm/ask', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({question, cloud: currentCloud}),
    });
    const data = await res.json();

    if (data.error) {
      answerText.className = 'answer-text error';
      answerText.textContent = 'Error: ' + data.error;
      return;
    }

    answerText.className   = 'answer-text';
    answerText.textContent = data.answer || '(no answer returned)';

    // Sources
    const sources     = data.sources      || [];
    const sourceLinks = data.source_links || [];
    if (sources.length) {
      srcList.innerHTML = sources.map(s => `<span class="source-chip">${s}</span>`).join('');
      document.getElementById('sourceLinks').innerHTML = sourceLinks.map(l =>
        `<a class="source-link" href="${l.url}" target="_blank" rel="noopener">${l.label} →</a>`
      ).join('');
      srcCard.classList.add('visible');
    }

    // History
    history.unshift({q: question, cloud: currentCloud, answer: data.answer, sources, sourceLinks});
    if (history.length > 10) history.pop();
    renderHistory();

  } catch(e) {
    answerText.className   = 'answer-text error';
    answerText.textContent = 'Request failed: ' + e;
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Ask';
  }
}

// ── history ───────────────────────────────────────────────────────────────────

function renderHistory() {
  const section = document.getElementById('historySection');
  const list    = document.getElementById('historyList');
  if (!history.length) { section.style.display = 'none'; return; }
  section.style.display = '';
  list.innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="recallHistory(${i})">
      <span class="history-cloud hc-${h.cloud}">${h.cloud.toUpperCase()}</span>
      <span class="history-q">${h.q}</span>
    </div>
  `).join('');
}

function recallHistory(i) {
  const h = history[i];
  if (!h) return;
  setCloud(h.cloud);
  document.getElementById('questionInput').value = h.q;

  const answerCard = document.getElementById('answerCard');
  const answerText = document.getElementById('answerText');
  const answerQ    = document.getElementById('answerQ');
  const srcCard    = document.getElementById('sourcesCard');
  const srcList    = document.getElementById('sourcesList');

  answerCard.classList.add('visible');
  answerQ.textContent    = h.q;
  answerText.className   = 'answer-text';
  answerText.textContent = h.answer;

  if (h.sources && h.sources.length) {
    srcList.innerHTML = h.sources.map(s => `<span class="source-chip">${s}</span>`).join('');
    document.getElementById('sourceLinks').innerHTML = (h.sourceLinks || []).map(l =>
      `<a class="source-link" href="${l.url}" target="_blank" rel="noopener">${l.label} →</a>`
    ).join('');
    srcCard.classList.add('visible');
  } else {
    srcCard.classList.remove('visible');
  }

  answerCard.scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ── init ──────────────────────────────────────────────────────────────────────
renderExamples();
</script>
</body>
</html>
